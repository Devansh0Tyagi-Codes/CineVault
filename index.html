<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CineVault</title>

    <link rel="stylesheet" href="style.css" />

    <!--here i use Font Awesome Icons for special icons-->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
    />

    <!-- here i use Google Font  -->
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <header>
      <div class="logo">
        <i class="fa-solid fa-film"></i>

        <h2>CineVault</h2>
      </div>

      <nav>
        <ul>
          <li><a href="#">Home</a></li>

          <li><a href="#">Movies</a></li>

          <li><a href="#">TV Shows</a></li>

          <li><a href="#">Top Rated</a></li>

          <li><a href="#">Favorites</a></li>
        </ul>
      </nav>

      <div class="nav-icons">
        <i class="fa-solid fa-magnifying-glass"></i>

        <i class="fa-regular fa-moon"></i>

        <i class="fa-regular fa-user"></i>
      </div>
    </header>
    <!-- ================= HERO SECTION ================= -->

    <section class="hero">
      <div class="hero-content">
        <h1>Discover Your Next Favorite Movie</h1>

        <p>
          Browse top-rated Movies and TV Shows with IMDb and Rotten Tomatoes
          ratings.
        </p>

        <div class="hero-buttons">
          <a href="#" class="btn-primary"> Browse Movies </a>

          <a href="#" class="btn-secondary"> Top Rated </a>
        </div>
      </div>
    </section>

   <!-- ================= Trending Movies Section ================= -->

<section class="trending">

</section>
